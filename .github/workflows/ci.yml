name: check

on:
  push:
  pull_request:

jobs:
  # 개발 도구(tsup, vitest)가 요구하는 Node에서 lint/typecheck/test를 돌린다.
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # 한쪽이 깨져도 다른 버전 결과를 같이 보기 위해 중단하지 않는다.
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check

  # engines.node의 하한(Node 20)에서 빌드 산출물이 실제로 실행되는지 확인한다.
  # 빌드는 개발용 Node(22)에서 하고, 실행만 Node 20으로 바꿔서 검증한다.
  runtime-floor:
    name: dist on Node 20 (engines floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Switch to Node 20 (runtime only)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify dist/cli.js runs on Node 20
        run: |
          node --version
          node dist/cli.js --help
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/cli.js --version)"
          echo "package.json=$expected  dist/cli.js=$actual"
          test "$expected" = "$actual"

      # examples 파일로 종료 코드 규약(0/1/2)을 실제 산출물에서 확인한다.
      # 주의: 이 run은 bash -e로 실행되므로, 0이 아닌 종료 코드는 "|| code=$?"로 받아야
      # 스텝이 그 자리에서 죽지 않는다. "! 명령"은 1과 2를 구분하지 못해 쓰지 않는다.
      - name: Verify exit codes with examples
        run: |
          schema=examples/analysis.schema.json
          fail=0

          run_case() {
            expected="$1"
            label="$2"
            shift 2

            code=0
            output="$("$@" 2>&1)" || code=$?

            if [ "$code" -eq "$expected" ]; then
              printf 'OK    %s — 종료 코드 %s\n' "$label" "$code"
            else
              printf 'FAIL  %s — 기대 종료 코드 %s, 실제 %s\n' "$label" "$expected" "$code"
              printf '%s\n' "$output" | sed 's/^/        | /'
              fail=1
            fi
          }

          run_case 0 "output-ok.txt (통과)" node dist/cli.js validate examples/output-ok.txt --schema "$schema"
          run_case 1 "output-bad.txt (스키마 위반)" node dist/cli.js validate examples/output-bad.txt --schema "$schema"
          run_case 1 "output-broken.txt (JSON 추출 실패)" node dist/cli.js validate examples/output-broken.txt --schema "$schema"
          run_case 2 "없는 입력 파일 (입출력 오류)" node dist/cli.js validate examples/nope.txt --schema "$schema"
          run_case 2 "--schema 누락 (사용법 오류)" node dist/cli.js validate examples/output-ok.txt
          run_case 0 "--help" node dist/cli.js --help

          # 종료 코드가 0이나 1이면 stdout은 유효한 JSON이어야 한다(--json 규약).
          code=0
          report="$(node dist/cli.js validate examples/output-bad.txt --schema "$schema" --json)" || code=$?
          if [ "$code" -ne 1 ]; then
            printf 'FAIL  --json (스키마 위반) — 기대 종료 코드 1, 실제 %s\n' "$code"
            fail=1
          elif printf '%s' "$report" | node --input-type=module -e 'import { readFileSync } from "node:fs"; JSON.parse(readFileSync(0, "utf8"));'; then
            printf 'OK    --json (스키마 위반) — 종료 코드 1, stdout이 유효한 JSON\n'
          else
            printf 'FAIL  --json (스키마 위반) — stdout이 JSON으로 파싱되지 않음\n'
            printf '%s\n' "$report" | sed 's/^/        | /'
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "E2E 실패: 위 FAIL 항목을 확인하세요"
            exit 1
          fi
          echo "E2E 통과"
